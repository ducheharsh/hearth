id: adguard-home
name: AdGuard Home
description: Network-wide ad and tracker blocking. Point Tailscale DNS at it for every device.
category: network
website: https://github.com/AdguardTeam/AdGuardHome
repo: AdguardTeam/AdGuardHome
docker_hub: adguard/adguardhome
featured: true
editors_note: "Block ads and trackers on every device, everywhere, through Tailscale."
port: 8053
upstream: { service: adguard, port: 80 }
resources: { ram_mb: 120 }
compose: |
  services:
    adguard:
      image: adguard/adguardhome:latest
      restart: unless-stopped
      ports:
        - "53:53/tcp"
        - "53:53/udp"
      volumes:
        - ${APP_DATA}/work:/opt/adguardhome/work
        - ${APP_DATA}/conf:/opt/adguardhome/conf
